[build-system]
requires = ["setuptools>=84.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eullm-reflex-mcp"
dynamic = ["version"]
description = "MCP server for Reflex, EuLLM's decision primitive: tool selection, a RAG sufficiency gate and typed decisions over /v1/systemone"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.10"
authors = [
    { name = "EULLM Team", email = "dev@eullm.eu" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Both MIT/BSD-3-Clause, and every package they pull in is MIT, BSD,
# Apache-2.0 or PSF. The upper bounds are major versions: mcp 2 renamed
# FastMCP to MCPServer and changed its imports, so a 3 is not assumed to be
# compatible. httpx2 is already a dependency of mcp; it is named here
# because this package calls it directly.
dependencies = [
    "mcp>=2.2.0,<3",
    "httpx2>=2.13.1,<3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.16.9",
]

[project.urls]
Homepage = "https://github.com/eullm/eullm/tree/main/adapters/reflex-mcp"

[project.scripts]
eullm-reflex-mcp = "eullm_reflex_mcp.server:main"

[tool.setuptools.dynamic]
version = { attr = "eullm_reflex_mcp.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
