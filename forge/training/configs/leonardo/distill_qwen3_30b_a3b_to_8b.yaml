# Phase 2 — the LARGER STUDENT. Qwen3-8B-Base, same teacher, same corpus.
#
# WHY THIS EXISTS, in two parts.
#
# The result. The 4 B student reached 23 % below its base on Consiglio di
# Stato text — a court its training never touched — at 40 % of one epoch. It
# writes competent legal Italian and gets article numbers wrong, which is a
# capacity problem as much as a training one. "Ability to train a larger
# student" is a success criterion in ADR-001 Part 13, and an 8 B student is
# item 2 of the backlog in docs/leonardo-allocation-plan.md. Run against the
# 4 B at matched steps on the same held-out corpus, it also yields a scaling
# curve for a vertical domain, which is a better report than either model
# alone.
#
# The allocation. queue_stats measured, on 2026-09-22: 47.6 % of calendar
# with at least one job running, and a mean of 1.08 nodes while busy. The
# plan written on 2026-09-11 said that averaging one busy node requires
# stretches at two or three, because gaps are certain. We never went there.
# Of the idle time, 161.7 h was an empty queue — nearly all of it the first
# week, before the pipeline worked — and 98.0 h was a full cluster. At the
# current rate the allocation ends around 60 % used, and unused hours are a
# reportable outcome that counts against the next request.
#
# A second independent chain raises concurrency and covers the other chain's
# queue gaps: when one waits, the other can take a backfill window.
#
# NOT COMPARABLE WITH EITHER 4 B ARM AS AN A/B ON THE PIPELINE. The student
# size is the variable here, so everything else is held identical to the
# split arm on purpose — teacher, adapter, corpus, LoRA rank, objective,
# schedule, seed. Changing any of them would make this measure two things.
#
#   GPU 0-1   teacher Qwen3-30B-A3B BF16, ~30.5 GB per card
#   GPU 2     student Qwen3-8B + LoRA + AdamW + activations, ~30 / 64 GB
#   GPU 3     free, as in the split arm
#
# GPU 3 STAYS FREE, and that is not waste: CINECA bills the whole node
# regardless of how many GPUs a job uses, so filling it would change the
# effective batch without saving an hour. Keeping the layout identical to the
# split arm is worth more than the idle card.
#
# Launch:
#   sbatch "$EULLM_REPO/forge/scripts/leonardo/sbatch_phase2_8b.slurm"

### models
teacher_model: Qwen/Qwen3-30B-A3B-Base
# Phase-1 LoRA adapter, relative to the job's working directory. The SAME
# adapter the control arm uses — the pipeline is the variable under test, so
# the teacher must not be.
teacher_adapter: ./checkpoints/qwen3_30b_a3b_legal_it_continued_pt
student_model: Qwen/Qwen3-8B-Base
# BF16. This is the difference the split pays for; turning either of these on
# would spend a whole node layout to arrive back where v1.0 already is.
teacher_load_in_8bit: false
teacher_load_in_4bit: false

### teacher placement — design B
teacher_device_map: split
teacher_gpus: [0, 1]
teacher_gib_per_gpu: 58
student_device: cuda:2

### student fine-tuning method
# Identical to the control arm, so the A/B isolates the node layout.
student_finetune: lora
student_lora_rank: 128
student_lora_alpha: 256
student_lora_dropout: 0.0
student_lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

### data
# Overridden by the data-dir argument distill.sh passes on the CLI.
dataset_dir: ~/datasets/legal_it
train_file: train.jsonl
val_file: val.jsonl
cutoff_len: 2048
max_train_samples: null

### training
# Its own directory, and its own run directory: two chains writing
# checkpoint-N into one place would each resume from the other's state.
output_dir: ./checkpoints/qwen3_8b_legal_it_distilled
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 5.0e-5
weight_decay: 0.01
max_grad_norm: 1.0
num_train_epochs: 1
max_steps: -1
warmup_steps: 1000
# 300 and a bounded directory, for the reasons measured on the control arm:
# at ~333 steps/hour a 1000-step interval hands the next link of the chain up
# to three hours of work to redo.
save_steps: 300
save_total_limit: 3
eval_steps: 1000
eval_max_batches: 200
logging_steps: 20

### distillation
# Same objective as the control arm. Changing these would make the A/B
# measure two things at once.
kl_temperature: 2.0
kl_alpha: 0.7

### hardware
bf16: true
gradient_checkpointing: true
seed: 42
