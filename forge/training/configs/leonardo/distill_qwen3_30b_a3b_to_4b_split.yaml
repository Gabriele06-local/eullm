# Phase 2, ADR-001 DESIGN B — split node, teacher BF16, no cache.
#
# The other Leonardo config (distill_qwen3_30b_a3b_to_4b_leonardo.yaml) is
# the v1.0 control arm and shares cuda:0 between a teacher shard and the
# student. That sharing is what forced the teacher to 8-bit: a shard, the
# student, its LoRA, its optimizer state and its activations all had to fit
# in one 64 GB card. This config removes the sharing instead of the
# precision.
#
#   GPU 0-1   teacher Qwen3-30B-A3B BF16, ~30.5 GB per card before
#             activations (61 GB of weights over two cards of 64)
#   GPU 2     student Qwen3-4B + LoRA + AdamW + activations, ~20 / 64 GB
#   GPU 3     deliberately free — see below
#
# WHY BF16 AT ALL, given P6. P6 measured the 8-bit teacher against bf16 over
# 97,773 positions: KL 0.00616 nats, top-5 agreement 99.955 %. So quantizing
# did NOT distort the target, and "BF16 fixes a quality problem" is not the
# claim this config makes. What the split buys is headroom and the ability to
# train a larger student (ADR-001 Part 13 success criteria), plus removing a
# dependency on bitsandbytes inside the hot loop. The quality claim, if any,
# has to come out of the A/B against the control arm, not out of this header.
#
# GPU 3 IS NOT AN OVERSIGHT. The first run of design B is a measurement —
# node-hours and throughput against the control arm — and a second student
# replica would change the effective batch and make the two incomparable.
# Once the measurement exists, GPU 3 is where the student goes to DDP (ADR
# Part 9), or where a 7B/8B student fits instead of the 4B.
#
# NOT COMPARABLE WITH THE CONTROL ARM'S CHECKPOINTS. Different output_dir on
# purpose: two Phase-2 runs writing `checkpoint-N` into one directory would
# have each resume from the other's state.
#
# Launch:
#   sbatch "$EULLM_REPO/forge/scripts/leonardo/sbatch_phase2_split.slurm"

### models
teacher_model: Qwen/Qwen3-30B-A3B-Base
# Phase-1 LoRA adapter, relative to the job's working directory. The SAME
# adapter the control arm uses — the pipeline is the variable under test, so
# the teacher must not be.
teacher_adapter: ./checkpoints/qwen3_30b_a3b_legal_it_continued_pt
student_model: Qwen/Qwen3-4B-Base
# BF16. This is the difference the split pays for; turning either of these on
# would spend a whole node layout to arrive back where v1.0 already is.
teacher_load_in_8bit: false
teacher_load_in_4bit: false

### teacher placement — design B
teacher_device_map: split
teacher_gpus: [0, 1]
teacher_gib_per_gpu: 58
student_device: cuda:2

### student fine-tuning method
# Identical to the control arm, so the A/B isolates the node layout.
student_finetune: lora
student_lora_rank: 128
student_lora_alpha: 256
student_lora_dropout: 0.0
student_lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

### data
# Overridden by the data-dir argument distill.sh passes on the CLI.
dataset_dir: ~/datasets/legal_it
train_file: train.jsonl
val_file: val.jsonl
cutoff_len: 2048
max_train_samples: null

### training
# Its own directory — see the header.
output_dir: ./checkpoints/qwen3_4b_legal_it_distilled_split
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 5.0e-5
weight_decay: 0.01
max_grad_norm: 1.0
num_train_epochs: 1
max_steps: -1
warmup_steps: 1000
# 300 and a bounded directory, for the reasons measured on the control arm:
# at ~333 steps/hour a 1000-step interval hands the next link of the chain up
# to three hours of work to redo.
save_steps: 300
save_total_limit: 3
eval_steps: 1000
eval_max_batches: 200
logging_steps: 20

### distillation
# Same objective as the control arm. Changing these would make the A/B
# measure two things at once.
kl_temperature: 2.0
kl_alpha: 0.7

### hardware
bf16: true
gradient_checkpointing: true
seed: 42
