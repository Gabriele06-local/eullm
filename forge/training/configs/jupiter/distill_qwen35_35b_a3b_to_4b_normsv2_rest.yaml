# distill_qwen35_35b_a3b_to_4b_normsv2.yaml continued on the rest of norms-v2:
# the student is the model that epoch made (merged), and the chunks are the
# 142,538 training chunks of norms-v2-full the 250,000 sample left out
# (build_norms_v2_rest.sh, $FORGE_DATA_DIR/norms-v2-rest), the same 3,000
# held out. Whether the whole corpus moves the student further than the
# sample did. The student's path is expanded by the job, where
# $FORGE_RUN_DIR is set. Needs FORGE_EXTRA_LIBS=$FORGE_HOME/libs-qwen35.
teacher_model: Qwen/Qwen3.5-35B-A3B-Base
teacher_adapter: null
student_model: $FORGE_RUN_DIR/q35v2-4b/checkpoints/qwen35_4b_normsv2_distilled/merged
teacher_load_in_8bit: false
teacher_load_in_4bit: false
teacher_device_map: split
teacher_gpus: [0]
teacher_gib_per_gpu: 80
student_device: cuda:1
student_finetune: lora
student_lora_rank: 128
student_lora_alpha: 256
student_lora_dropout: 0.0
student_lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - in_proj_qkv
  - in_proj_z
  - out_proj
  - gate_proj
  - up_proj
  - down_proj
dataset_dir: ./datasets/norms   # overridden by sbatch_distill.slurm (--dataset-dir)
train_file: train.jsonl
val_file: val.jsonl
cutoff_len: 2048
max_train_samples: null
output_dir: ./checkpoints/qwen35_4b_normsv2_rest_distilled
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 5.0e-5
weight_decay: 0.01
max_grad_norm: 1.0
num_train_epochs: 1
max_steps: -1
warmup_steps: 100
save_steps: 100
save_total_limit: 3
eval_steps: 500
eval_max_batches: 40
logging_steps: 20
kl_temperature: 2.0
kl_alpha: 0.7
bf16: true
gradient_checkpointing: true
seed: 42
