name: CI

# Pull requests as well as pushes. This workflow was written for both — the
# `changes` job asks for `pull-requests: read`, `dorny/paths-filter` needs a
# base to diff against, and every component job carries
# `|| github.event_name == 'push'` to bypass that filter — but the trigger was
# push-only, so none of it ever fired before a merge. CI was a post-merge
# report, not a gate: a pull request could be merged untested and the first
# run happened on `main`, with the breakage already in. Two external
# contributions (#443, #444) arrived with no checks at all, one of them
# explicitly relying on "CI's Linux check/clippy/test run" as its gate.
#
# `pull_request`, not `pull_request_target`: this workflow builds and runs code
# from the pull request's head, and `pull_request_target` would hand that code
# a writable token and the repository's secrets. It takes neither. The token is
# read-only, and the only `secrets.` reference below — the sccache backend in
# the engine job — sits in a step guarded by `github.event_name == 'push'`, so
# a pull_request run, fork or not, is still secret-less while it builds code
# from the pull request. Do not "fix" a fork's cold cache by switching the
# trigger, and do not lift that guard, which is the same trade by another
# route: a same-repo pull request does receive secrets, and `cargo test` runs
# whatever that branch put in a test.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One run per pull request rather than per commit, so pushing a fixup cancels
# the build of the commit it replaces. On a push event there is no PR number
# and this falls back to the previous per-SHA behaviour.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Force any JS-based action still pinned to Node 20 to run on Node 24.
  # Documented escape hatch from GitHub's Node 20 deprecation notice
  # (https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/).
  # Needed today because KyleMayes/install-llvm-action has not yet shipped
  # a v3 with a Node 24 runtime.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ── No AI attribution in commit messages ────────────────────────────────
  #
  # CLAUDE.md already forbids this, but a rule enforced by attention gets
  # broken by inattention: eight commits from 25 July carry a
  # `Co-Authored-By: Claude Opus 5` trailer that nobody meant to publish, and
  # GitHub renders those as a second author on the commit. They are inside
  # released tags now, so rewriting them would invalidate the tags for a
  # cosmetic gain. This stops the next one instead.
  #
  # Only inspects commits new to this push, so the existing history does not
  # fail every run forever. `github.event.before` is all zeros on the first
  # push of a branch; in that case fall back to the single head commit.
  #
  # A pull request needs its own range, and taking the push branch would be
  # worse than useless. On a `pull_request` event `github.event.before` does
  # not exist, so the fallback would scan `-1 $github.sha` — and on that event
  # `github.sha` is the throwaway merge commit GitHub builds for the checkout,
  # authored by "GitHub <noreply@github.com>". The job would pass every time
  # while never once looking at the commits under review. Use the base and head
  # the event carries instead; `fetch-depth: 0` on the merge ref puts both
  # inside the clone.
  commit_hygiene:
    name: No AI attribution in commit messages
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scan new commit messages
        env:
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -n "${PR_HEAD:-}" ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -z "${BEFORE:-}" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            range="-1 $HEAD_SHA"
          else
            range="$BEFORE..$HEAD_SHA"
          fi
          echo "Scanning: git log $range"

          # Anchored to the START OF A LINE, which is not a detail: a git
          # trailer is only a trailer when it opens its own line. Without the
          # anchor this job failed on the very commit that introduced it,
          # because that commit's message explains the rule in prose and the
          # words "Co-Authored-By: Claude" appear mid-sentence. A message that
          # describes the convention must stay pushable; one that carries the
          # trailer must not.
          #
          # Matching on the word "claude" alone is wrong for the same reason:
          # the repository contains CLAUDE.md and commits that edit it are
          # ordinary work.
          pattern='^[[:space:]]*(🤖[[:space:]]*)?(Co-Authored-By:[[:space:]]*Claude|Claude-Session:|Generated with \[?Claude)'

          if git log $range --format='%H%n%an <%ae>%n%B%n---' | grep -inE "$pattern"; then
            echo
            echo "::error::A commit message carries AI attribution. See .claude/CLAUDE.md: commits are authored by primoco and carry no reference to the tool used to write them. Amend or rebase the offending commit and force-push the branch."
            exit 1
          fi

          # Same rule for the identity fields: one merge commit reached main
          # authored by "Claude" because the author override was set on the
          # commits but not on the merge.
          #
          # Both fields, not just the author. A commit carries an author and a
          # committer, and `git cherry-pick`, `rebase` and `commit --amend`
          # rewrite the second one from whatever identity the environment has
          # configured while faithfully preserving the first. Two commits
          # reached main that way, and GitHub renders them as "primoco authored
          # and Claude committed" — the exact second name this check exists to
          # keep out, sitting in the one field it was not looking at.
          if git log $range --format='%an|%ae|%cn|%ce' | grep -iE '(^|\|)claude|anthropic\.com'; then
            echo
            echo "::error::A commit carries an AI tool identity as its author or committer. Both must be primoco <58369875+primoco@users.noreply.github.com>, merges included. The committer is set by the environment's git config, so a cherry-pick or rebase can reintroduce it even when every author is right: check `git log --format='%h %an|%cn'`."
            exit 1
          fi

          echo "No AI attribution found in the new commits."

      # Nothing in CI builds the container images, so a toolchain too old to
      # read a Cargo.toml is invisible until someone follows the documented
      # `docker build` and it dies before compiling anything. Both images
      # pinned rust 1.83 while both manifests declare edition 2024, which
      # needs 1.85.
      - name: The container images can read the manifests they build
        run: |
          set -euo pipefail
          # 1.0-1.84: 1.0, 1.10-1.79, 1.80-1.84. 1.85 and anything newer, and
          # a bare `rust:1` or `rust:bookworm`, are accepted -- the tag has to
          # be able to follow whatever the manifests end up declaring.
          stale='^FROM rust:1\.(0|[1-7][0-9]|8[0-4])'
          for f in hub/Dockerfile engine/Dockerfile; do
            if grep -qE "$stale" "$f"; then
              echo "::error::$f pins a Rust older than 1.85, which cannot parse edition = 2024. Use rust:1-bookworm."
              exit 1
            fi
            echo "$f: $(grep -m1 -E '^FROM rust:' "$f")"
          done

  # ── Detect which components changed ──────────────────────────────────
  changes:
    name: Detect changes
    runs-on: ubuntu-22.04
    permissions:
      # Declaring any `permissions:` block zeroes every scope not listed, so
      # `contents: read` has to be spelled out for `actions/checkout` even
      # though it used to be implicit. It survived on push only because the
      # repository is public; a fork's pull request runs with an already
      # read-only token and no reason to be narrower still.
      contents: read
      # paths-filter asks the API which files the pull request touches.
      pull-requests: read
    outputs:
      engine: ${{ steps.filter.outputs.engine }}
      hub: ${{ steps.filter.outputs.hub }}
      forge: ${{ steps.filter.outputs.forge }}
      bench: ${{ steps.filter.outputs.bench }}
      reflex_mcp: ${{ steps.filter.outputs.reflex_mcp }}
      examples: ${{ steps.filter.outputs.examples }}
      windows_packaging: ${{ steps.filter.outputs.windows_packaging }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # The root manifest and lockfile belong to both Rust components:
          # `engine` and `hub` are members of one workspace with a single
          # `Cargo.lock`, so a dependency bump made at the root changes what
          # they compile against while touching neither directory. Without
          # these entries such a pull request skips both build jobs and is
          # merged untested — this very workflow's first run did exactly that
          # while bumping rustls out of RUSTSEC-2026-0285.
          #
          # The workflow file itself is in every filter for the same reason:
          # a change to how a job builds is only tested by running that job.
          filters: |
            engine:
              - 'engine/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
            hub:
              - 'hub/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
            forge:
              - 'forge/**'
              - '.github/workflows/ci.yml'
            bench:
              - 'bench/**'
              # The campaign specs are validated by bench/campaign's tests.
              - 'tools/lumi/campaigns/**'
              - 'catalog/**'
              - '.github/workflows/ci.yml'
            # ReflexBench too: the adapter asks its questions word for word,
            # and a test checks they have not drifted apart.
            reflex_mcp:
              - 'adapters/reflex-mcp/**'
              - 'bench/reflexbench/**'
              - '.github/workflows/ci.yml'
            examples:
              - 'examples/**'
              - '.github/workflows/ci.yml'
            windows_packaging:
              - 'installer/**'
              - '.github/scripts/**'
              - '.github/workflows/ci.yml'

  # ── Dependency, licence and advisory policy ──────────────────────────
  # Runs on every push and every pull request, not behind the `changes`
  # filter: a dependency can become vulnerable without anyone touching this
  # repository, so this job has to run when nothing changed as much as when
  # something did.
  #
  # `CLAUDE.md` forbids copyleft *dependencies* and requires them to stay
  # permissive; our own crates are the deliberate exception (AGPL-3.0-or-later
  # since the 2026-08 relicense, see `deny.toml`'s `[[licenses.exceptions]]`).
  # That rule was enforced by manual diligence until this job existed — it
  # held, but only for as long as somebody remembered to look.
  # The policy lives in `deny.toml`; adding a crate whose licence is not on the
  # allow-list fails here rather than being discovered at a licence review.
  deps:
    name: Dependencies (licences + advisories)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        # No submodules: cargo-deny reads manifests, never the C++ source, and
        # the llama.cpp checkout is over a gigabyte.
      # The release binary, not EmbarkStudios/cargo-deny-action: the action
      # builds a Docker image on every run (rust:alpine, apk update, then this
      # same tarball), and on 2026-10-09 that build failed on three runs in a
      # row with no change on our side, turning main red. The binary is what
      # the image ran anyway; the checksum is the one published beside it.
      - name: Install cargo-deny
        env:
          DENY_VERSION: "0.20.2"
          DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
        run: |
          set -euo pipefail
          name="cargo-deny-${DENY_VERSION}-x86_64-unknown-linux-musl"
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/deny.tgz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${DENY_VERSION}/${name}.tar.gz"
          echo "${DENY_SHA256}  $RUNNER_TEMP/deny.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/deny.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/${name}" >> "$GITHUB_PATH"
      # One workspace at the repository root covers engine, hub and the
      # vendored llama-cpp-rs crates.
      - name: cargo deny
        run: cargo-deny --log-level warn --manifest-path ./Cargo.toml --all-features check advisories bans licenses sources

  # ── Engine ───────────────────────────────────────────────────────────
  engine:
    name: Engine (build + test)
    needs: changes
    if: needs.changes.outputs.engine == 'true' || github.event_name == 'push'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          # llama.cpp source lives in engine/vendor/llama-cpp-rs/llama-cpp-sys-2/llama.cpp
          # as a submodule of this repo; required to build the engine.
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "engine -> target"
      - name: Install dependencies
        run: sudo DEBIAN_FRONTEND=noninteractive apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y cmake build-essential pkg-config libssl-dev

      # sccache for the C++ half of this job, on pushes to main only.
      #
      # Why it is worth having: this job IS the length of a CI run. Measured on
      # run #541 (a merge that touched only forge/): 11m57s of a 12m09s run,
      # while every other job finished inside 2m40s. Inside it, `cargo build`
      # took 4m03s and `cargo check --features multimodal` 3m19s, and both
      # compile llama.cpp's C++ from scratch — the multimodal step is not a
      # cheap check, turning the feature on makes llama-cpp-sys-2 build the
      # mtmd/clip sources as well, so the C++ is built twice per run.
      # Swatinem/rust-cache cannot help: it caches Rust artifacts, and the
      # vendored llama-cpp crates are workspace members, which it drops before
      # saving. sccache is content-addressed, so an unchanged submodule hits
      # across runs no matter which branch wrote the objects.
      #
      # Why `push` only, and why this is not what the header forbids: the
      # header's rule is that this workflow stays secret-less while it builds
      # and runs pull-request code. A push to main is neither — that code is
      # already merged and reviewed. Every `secrets.` reference lives inside
      # this one guarded step, so a pull_request run, fork or not, still sees
      # no secrets and behaves exactly as it does today. Do NOT lift the guard
      # to speed pull requests up: that is precisely the trade the header
      # refuses. If PR runs should read the cache, give them a read-only
      # bucket credential — a different change, with its own reasoning.
      #
      # 0.8.0 on purpose, matching release-engine.yml. Both workflows share one
      # content-addressed bucket and sccache changes its cache-key handling
      # between versions, so a mismatch means neither ever hits the other's
      # objects — the opposite of the point. Upgrade both together or neither.
      - name: Install sccache
        if: github.event_name == 'push'
        env:
          SCCACHE_BUCKET: ${{ secrets.SCCACHE_BUCKET }}
          SCCACHE_ENDPOINT: ${{ secrets.SCCACHE_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "${SCCACHE_ENDPOINT}" ]; then
            echo "::notice::No sccache backend configured for this run — building without it."
            exit 0
          fi
          SCCACHE_VER=0.8.0
          TMPSC=$(mktemp -d)
          curl -sSfL "https://github.com/mozilla/sccache/releases/download/v${SCCACHE_VER}/sccache-v${SCCACHE_VER}-x86_64-unknown-linux-musl.tar.gz" \
            -o "${TMPSC}/sccache.tar.gz"
          tar -xzf "${TMPSC}/sccache.tar.gz" -C "${TMPSC}"
          find "${TMPSC}" -maxdepth 2 -name sccache -type f -exec mv {} /usr/local/bin/ \;
          chmod +x /usr/local/bin/sccache
          rm -rf "${TMPSC}"
          # A backend outage must degrade to a cache-less build, never fail one.
          if curl -sSf -m 10 "${SCCACHE_ENDPOINT}/minio/health/live" >/dev/null 2>&1; then
            {
              echo "SCCACHE_BUCKET=${SCCACHE_BUCKET}"
              echo "SCCACHE_ENDPOINT=${SCCACHE_ENDPOINT}"
              echo "SCCACHE_REGION=us-east-1"
              echo "SCCACHE_S3_USE_SSL=true"
              echo "AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}"
              echo "AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}"
              # The default 600s idle shutdown can kill the daemon mid-build,
              # after which a fresh one re-handshakes with S3 and a blip reads
              # as "Timed out waiting for server startup".
              echo "SCCACHE_IDLE_TIMEOUT=0"
              echo "RUSTC_WRAPPER=sccache"
              echo "CMAKE_C_COMPILER_LAUNCHER=sccache"
              echo "CMAKE_CXX_COMPILER_LAUNCHER=sccache"
            } >> "$GITHUB_ENV"
            echo "sccache: S3 backend reachable — caching enabled."
          else
            echo "::warning::sccache S3 backend unreachable — building WITHOUT cache (slower, but the build will not fail)."
          fi
          sccache --version

      # The list of architectures this binary can load is generated from the
      # vendored llama.cpp, because `llama.h` offers no way to ask at runtime.
      # Generated, not hand-written: a bump that adds an architecture would
      # otherwise leave the catalog telling users a model will not load when it
      # would, and nothing would ever catch it. Regenerating here and diffing
      # is what makes the file impossible to merge stale.
      - name: The generated architecture list matches the submodule
        run: |
          ./tools/gen-llama-archs.sh
          git diff --exit-code -- engine/src/llama_archs.rs || {
            echo "::error::engine/src/llama_archs.rs is out of date with the llama.cpp submodule. Run tools/gen-llama-archs.sh and commit the result."
            exit 1
          }

      - name: Build
        working-directory: engine
        run: cargo build
      - name: Test
        working-directory: engine
        run: cargo test
      - name: Clippy
        working-directory: engine
        # --no-deps: lint only our own crate, never dependencies. The vendored
        # llama-cpp-rs crates are workspace members (a path dep under the
        # workspace root is always a member), so without --no-deps the
        # RUSTC_WORKSPACE_WRAPPER would run clippy on their build scripts and
        # `-D warnings` would fail on upstream's pedantic/missing-docs findings.
        #
        # No `-A dead-code -A unused-imports`. Those were global, and a global
        # suppression does not hide one known orphan — it hides every future
        # one. The branch it was covering (a KV-cache fallback for a state
        # `parse_cache_type` cannot produce, left over from the TurboQuant
        # integration removed in v0.5.8) is gone, and the audit-trail readers
        # that genuinely have no caller yet carry their own `#[allow]` naming
        # the backlog item that will use them.
        #
        # It paid for itself immediately: turning it off surfaced a local made
        # dead by the banner refactor in this same change.
        run: cargo clippy --no-deps -- -D warnings
      - name: Check the multimodal feature compiles
        working-directory: engine
        # The release CUDA jobs build with `--features "cuda,multimodal"`, and
        # code behind `#[cfg(feature = "multimodal")]` is invisible to every
        # step above. A refactor that changed a shared type therefore compiled
        # clean here, went green on main, and then broke all three CUDA jobs at
        # tag time — three long builds and a pulled release, for an error a
        # `cargo check` would have caught in a minute.
        #
        # `check`, not `build`: type errors are the failure mode this guards,
        # and the C++/CUDA side is not what changes underneath us. `cuda` is
        # deliberately not checked here — it needs the CUDA toolkit, which is a
        # multi-minute install on every push, and it shares this same Rust code.
        run: cargo check --features multimodal

      # Never claim sccache works without reading the stats. The line that
      # matters is "Cache hits (C/C++)": if it is absent or zero while the job
      # is still minutes long, the compiler launcher is not reaching nvcc/cc
      # and the cache is doing nothing for the expensive half of the build.
      - name: sccache stats
        if: always() && github.event_name == 'push'
        run: sccache --show-stats || true

  # ── Hub ──────────────────────────────────────────────────────────────
  hub:
    name: Hub (build + test)
    needs: changes
    if: needs.changes.outputs.hub == 'true' || github.event_name == 'push'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "hub -> target"
      - name: Build
        working-directory: hub
        run: cargo build
      - name: Test
        working-directory: hub
        run: cargo test

  # ── Forge ────────────────────────────────────────────────────────────
  forge:
    name: Forge (lint + test)
    needs: changes
    if: needs.changes.outputs.forge == 'true' || github.event_name == 'push'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: pip-forge-${{ hashFiles('forge/pyproject.toml') }}
          restore-keys: pip-forge-
      - name: Install
        working-directory: forge
        # setuptools upgraded explicitly: the runner image ships one old enough
        # to carry PYSEC-2026-3447 (MANIFEST.in exclusions can miss non-ASCII
        # filenames on macOS, fixed in 83.0.0), and the audit step below scans
        # the whole environment, tooling included. Upgrading is strictly better
        # than ignoring the advisory: the audit stays meaningful and the build
        # tool is current.
        run: |
          pip install --upgrade pip setuptools
          pip install -e ".[dev]"
      - name: Lint
        working-directory: forge
        run: ruff check eullm_forge/
      - name: Test
        working-directory: forge
        run: pytest -v
      - name: Audit dependencies
        working-directory: forge
        # The Python counterpart of the `deps` job. It is blocking on purpose:
        # a check that cannot fail reports nothing.
        #
        # A new advisory published upstream will turn this red without anything
        # in this repository having changed. When that happens the fix is to
        # upgrade the pinned floor in `pyproject.toml`, or — when no fixed
        # release exists yet — to add `--ignore-vuln <ID>` here with the reason
        # and the date, so it is reviewed later instead of disappearing.
        #
        # Not `--strict`. That flag fails the audit when *any* package cannot be
        # collected, and `pip install -e .` puts `eullm-forge` itself in the
        # environment — a package that is not on PyPI and never will be. The
        # first run failed on exactly that, with "Dependency not found on PyPI",
        # which is a true statement about our own source tree and not a finding.
        # `--skip-editable` does not rescue it: measured, a deliberately skipped
        # package still fails `--strict`. Dropping `--strict` costs nothing that
        # matters here — a vulnerability in a real dependency still exits
        # non-zero — and only means an unauditable package is reported instead
        # of fatal.
        #
        # IGNORED, 2026-09-08 — CVE-2026-69112 in accelerate.
        # Path traversal in `load_checkpoint_in_model` /
        # `load_checkpoint_and_dispatch`: `weight_map` entries in a sharded
        # checkpoint index are not sanitised, so a crafted
        # `model.safetensors.index.json` can read arbitrary files with `../`
        # or point a shard at a named pipe and hang the process.
        #
        # Ignored because there is nothing to upgrade to: 1.14.0 is the latest
        # release on PyPI and the advisory says "through 1.14.0", so every
        # published version is affected. Downgrading moves nothing.
        #
        # Our own exposure is low but not zero, and the distinction matters:
        # the Forge pipeline only loads checkpoints it prefetches itself from
        # Qwen's official repositories, and the Engine does not use accelerate
        # at all. But `eullm forge --base-model` takes an arbitrary Hub id, so
        # a user pointing Forge at an untrusted repository IS on the vulnerable
        # path. That is a documentation and validation question, tracked in
        # docs/backlog-fix-e-hardening.md, not something this ignore resolves.
        #
        # REMOVE THIS as soon as accelerate publishes a fixed release: bump the
        # floor in forge/pyproject.toml and delete the flag. Check with
        # `pip index versions accelerate` or the PyPI JSON API — a green audit
        # here will NOT tell you a fix has landed, because this flag suppresses
        # exactly the finding that would.
        run: |
          pip install pip-audit==2.10.1
          pip-audit --desc --skip-editable --ignore-vuln CVE-2026-69112

  # ── Benchmarks ───────────────────────────────────────────────────────
  # ReflexBench, the RAG gate, the qualification test and AutoBench are
  # standard-library Python whose tests run offline, against a stand-in
  # server and made-up files. They were run by hand only, so a change that
  # broke a benchmark's metrics surfaced when someone next ran it on a GPU.
  # The LUMI campaign runner (bench/campaign) is the same kind of code, and a
  # bug in it costs whole node-hours, so it is tested here too: against
  # fake_eullm.py, a stand-in engine, and with the shipped campaign specs.
  # No pip cache: two packages, pinned, install in seconds.
  bench:
    name: Bench (lint + test)
    needs: changes
    if: needs.changes.outputs.bench == 'true' || github.event_name == 'push'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install
        run: pip install ruff==0.16.9 pytest==9.1.1
      - name: Lint
        run: ruff check bench/reflexbench bench/campaign
      - name: Test
        run: pytest -q bench/reflexbench
      - name: Test (LUMI campaign runner)
        run: pytest -q bench/campaign

  # ── Reflex MCP adapter ───────────────────────────────────────────────
  # adapters/reflex-mcp, a Python package of its own on the MCP SDK. Its
  # tests need no model and no network: a stand-in EuLLM on 127.0.0.1, the
  # MCP SDK's in-memory client, and the command itself on stdio and HTTP.
  # Python 3.10 is the oldest the package declares; 3.13 a current one.
  reflex_mcp:
    name: Reflex MCP adapter (lint + test, Python ${{ matrix.python }})
    needs: changes
    if: needs.changes.outputs.reflex_mcp == 'true' || github.event_name == 'push'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-reflex-mcp-${{ matrix.python }}-${{ hashFiles('adapters/reflex-mcp/pyproject.toml') }}
          restore-keys: pip-reflex-mcp-${{ matrix.python }}-
      - name: Install
        # setuptools upgraded as in the forge job: the audit below scans the
        # whole environment, the build tooling included.
        run: |
          pip install --upgrade pip setuptools
          pip install "./adapters/reflex-mcp[dev]"
      - name: Lint
        working-directory: adapters/reflex-mcp
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Test
        run: python -m unittest discover -s adapters/reflex-mcp/tests -v
      - name: Audit dependencies
        # Blocking, as in the forge job, and not `--strict` for the same
        # reason: the package itself is not on PyPI, so it cannot be audited.
        run: |
          pip install pip-audit==2.10.1
          pip-audit --desc

  # ── Examples ─────────────────────────────────────────────────────────
  # The LangGraph graphs and the n8n workflow are what someone trying the
  # decision endpoint copies first. Their tests need no model and no network
  # beyond the pinned packages: a stand-in EuLLM on 127.0.0.1, and the
  # workflow read as JSON. They were run by hand only, so a fix to the
  # LangGraph client (#642) reached review with its tests never run.
  examples:
    name: Examples (test)
    needs: changes
    if: needs.changes.outputs.examples == 'true' || github.event_name == 'push'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-examples-${{ hashFiles('examples/decision-langgraph/requirements.txt') }}
          restore-keys: pip-examples-
      - name: Install
        run: |
          pip install --upgrade pip setuptools
          pip install -r examples/decision-langgraph/requirements.txt
      - name: Test the LangGraph graphs
        run: python -m unittest discover -s examples/decision-langgraph -v
      - name: Test the n8n workflow
        run: python -m unittest discover -s examples/decision-n8n -v
      - name: Audit dependencies
        # Blocking, as in the forge and reflex_mcp jobs: the requirements are
        # what a reader installs to run the example.
        run: |
          pip install pip-audit==2.10.1
          pip-audit --desc

  # ── Windows packaging (runs where it can fail: on Windows) ──────────
  # Three things that only run on Windows and would otherwise be exercised
  # for the first time by a release or by a user:
  #  - .github/scripts/bundle-vc-runtime.ps1, which release-engine.yml
  #    uses to put the MSVC runtime next to eullm.exe. It is tried here on
  #    a small C++ program that imports the same DLLs (C++ runtime, OpenMP),
  #    which is then run from its folder with the runtime present.
  #  - .github/scripts/pack-msix.ps1 and installer/msix/AppxManifest.xml,
  #    the Microsoft Store package.
  #  - installer/install.ps1, run for real against a published release.
  windows_packaging:
    name: Windows packaging (runtime bundle + MSIX + install.ps1)
    needs: changes
    if: needs.changes.outputs.windows_packaging == 'true' || github.event_name == 'push'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: bundle-vc-runtime.ps1 on an exe importing the C++ runtime and OpenMP
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          $out = Join-Path $env:RUNNER_TEMP 'bundle'
          New-Item -ItemType Directory -Path $out | Out-Null
          @(
            '#include <iostream>'
            '#include <omp.h>'
            'int main() { std::cout << "threads " << omp_get_max_threads() << std::endl; return 0; }'
          ) | Set-Content -Path "$out\probe.cpp"
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >NUL && cd /d `"$out`" && cl /nologo /EHsc /MD /openmp probe.cpp"
          if ($LASTEXITCODE -ne 0) { throw "cl failed with exit code $LASTEXITCODE" }
          Remove-Item "$out\probe.cpp", "$out\probe.obj"
          & .github\scripts\bundle-vc-runtime.ps1 -Exe "$out\probe.exe" -Destination $out
          Get-ChildItem $out | Format-Table Name, Length
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll', 'vcomp140.dll') {
            if (-not (Test-Path "$out\$dll")) { throw "$dll was not bundled" }
          }
          & "$out\probe.exe"
          if ($LASTEXITCODE -ne 0) { throw "probe.exe failed with exit code $LASTEXITCODE" }

      # MakeAppx validates AppxManifest.xml against the schema while it
      # packs, so this catches a broken manifest on the push that breaks it
      # instead of at the next release or at Store certification. The probe
      # from the step above stands in for eullm.exe; the files are not run.
      - name: pack-msix.ps1 with the Store manifest
        shell: pwsh
        run: |
          $probe = Join-Path $env:RUNNER_TEMP 'bundle'
          foreach ($d in 'cpu', 'cuda') {
            $dir = Join-Path $env:RUNNER_TEMP "msix-$d"
            New-Item -ItemType Directory -Path $dir | Out-Null
            Copy-Item "$probe\*.dll" $dir
            Copy-Item "$probe\probe.exe" "$dir\eullm.exe"
          }
          & .github\scripts\pack-msix.ps1 -CpuDir "$env:RUNNER_TEMP\msix-cpu" -CudaDir "$env:RUNNER_TEMP\msix-cuda" -Version 0.0.1.0 -Out "$env:RUNNER_TEMP\eullm-test.msix"

      # Which build a machine gets is decided by a driver query, the display
      # adapters' names and the Vulkan loader, so the decision is pinned here
      # against made-up machines: the runner has no GPU, and the point is the
      # matrix, not this machine. The functions are extracted through the AST
      # so the install body never runs. Select-EuLLMVariant takes the matrix
      # directly; Get-EuLLMVariant then runs against a stubbed nvidia-smi, for
      # the part that reads it.
      - name: install.ps1 GPU detection
        shell: pwsh
        run: |
          $ast = [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path installer\install.ps1), [ref]$null, [ref]$null)
          foreach ($name in 'Get-EuLLMVariant', 'Select-EuLLMVariant') {
            $fn = $ast.Find({
              param($n) $n -is [System.Management.Automation.Language.FunctionDefinitionAst] -and
                        $n.Name -eq $name
            }.GetNewClosure(), $true)
            if (-not $fn) { throw "$name not found in install.ps1" }
            Invoke-Expression $fn.Extent.Text
          }

          # 8.6/8.9/12.0 is what release-engine.yml compiles
          # (CMAKE_CUDA_ARCHITECTURES 86;89;120, no PTX), so anything else
          # cannot run the CUDA bundle -- including the A100/H100, which have
          # no Windows build at all. The Vulkan build takes the other GPUs,
          # when the driver installed the Vulkan loader.
          $rtx3060 = @('NVIDIA GeForce RTX 3060')
          $cases = @(
            @{ smi = '';             gpus = @();                                  vk = $false; want = 'cpu';    why = 'no GPU at all' }
            @{ smi = '';             gpus = @('Microsoft Basic Display Adapter'); vk = $true;  want = 'cpu';    why = 'no graphics driver' }
            @{ smi = '580.99, N/A';  gpus = @();                                  vk = $false; want = 'cpu';    why = 'no compute capability' }
            @{ smi = 'garbage';      gpus = @();                                  vk = $false; want = 'cpu';    why = 'unparsable output' }
            @{ smi = '580.99, 8.6';  gpus = $rtx3060;                             vk = $true;  want = 'cuda';   why = 'RTX 3000' }
            @{ smi = '580.99, 8.9';  gpus = @('Intel(R) UHD Graphics', 'NVIDIA GeForce RTX 4060 Laptop GPU'); vk = $true; want = 'cuda'; why = 'RTX 4000 laptop beside an Intel iGPU' }
            @{ smi = '580.99, 12.0'; gpus = @();                                  vk = $false; want = 'cuda';   why = 'RTX 5000, adapter query failed' }
            @{ smi = '570.86, 8.6';  gpus = $rtx3060;                             vk = $true;  want = 'vulkan'; why = 'driver older than 580: Vulkan runs it' }
            @{ smi = '570.86, 8.6';  gpus = $rtx3060;                             vk = $false; want = 'cpu';    why = 'driver older than 580, no Vulkan loader' }
            @{ smi = '580.99, 7.5';  gpus = @('NVIDIA GeForce RTX 2080 Ti');      vk = $true;  want = 'vulkan'; why = 'RTX 2000: not in the fatbin, Vulkan runs it' }
            @{ smi = '580.99, 7.5';  gpus = @('NVIDIA GeForce RTX 2080 Ti');      vk = $false; want = 'cpu';    why = 'RTX 2000, no Vulkan loader' }
            @{ smi = '580.99, 6.1';  gpus = @('NVIDIA GeForce GTX 1080');         vk = $true;  want = 'vulkan'; why = 'GTX 1000' }
            @{ smi = '580.99, 8.0';  gpus = @();                                  vk = $true;  want = 'cpu';    why = 'A100: no Windows datacenter build' }
            @{ smi = '580.99, 9.0';  gpus = @();                                  vk = $true;  want = 'cpu';    why = 'H100: no Windows datacenter build' }
            @{ smi = '';             gpus = @('AMD Radeon RX 7900 XTX');          vk = $true;  want = 'vulkan'; why = 'Radeon card' }
            @{ smi = '';             gpus = @('AMD Radeon(TM) Graphics');         vk = $true;  want = 'vulkan'; why = 'Ryzen integrated graphics' }
            @{ smi = '';             gpus = @('AMD Radeon RX 7900 XTX');          vk = $false; want = 'cpu';    why = 'Radeon, no Vulkan loader' }
            @{ smi = '';             gpus = @('Intel(R) Arc(TM) A770 Graphics');  vk = $true;  want = 'vulkan'; why = 'Intel Arc card' }
            @{ smi = '';             gpus = @('Intel(R) Arc(TM) Graphics');       vk = $true;  want = 'vulkan'; why = 'Core Ultra integrated Arc' }
            @{ smi = '';             gpus = @('Intel(R) Iris(R) Xe Graphics');    vk = $true;  want = 'cpu';    why = 'Iris Xe stays on the CPU build' }
            @{ smi = '';             gpus = @('Intel(R) UHD Graphics 630');       vk = $true;  want = 'cpu';    why = 'UHD stays on the CPU build' }
          )
          $failed = 0
          foreach ($c in $cases) {
            $got = Select-EuLLMVariant -Smi $c.smi -Gpus $c.gpus -HasVulkan $c.vk
            $machine = "nvidia-smi '$($c.smi)', adapters '$($c.gpus -join ' + ')', Vulkan loader $($c.vk)"
            if ($got -ne $c.want) {
              $failed++
              Write-Host "FAIL $machine -> '$got', want '$($c.want)' ($($c.why))"
            } else {
              Write-Host "ok   $machine -> '$got' ($($c.why))"
            }
          }

          # Get-EuLLMVariant reads nvidia-smi itself. The runner has no AMD,
          # Intel Arc or NVIDIA adapter, so only the stubbed line decides here.
          $tmpRoot = if ($env:RUNNER_TEMP) { $env:RUNNER_TEMP } else { [IO.Path]::GetTempPath() }
          $stubDir = Join-Path $tmpRoot 'smi-stub'
          New-Item -ItemType Directory -Path $stubDir -Force | Out-Null
          Set-Content -Path (Join-Path $stubDir 'nvidia-smi.cmd') -Value "@echo off`r`necho %EULLM_STUB_SMI%"
          $origPath = $env:Path
          $env:Path = "$stubDir;$origPath"
          foreach ($c in @(
            @{ smi = '580.99, 8.6';  want = 'cuda' }
            @{ smi = '580.99, 12.0'; want = 'cuda' }
            @{ smi = '570.86, 8.6';  want = 'cpu' }
            @{ smi = 'garbage';      want = 'cpu' }
          )) {
            $env:EULLM_STUB_SMI = $c.smi
            $got = Get-EuLLMVariant
            if ($got -ne $c.want) {
              $failed++
              Write-Host "FAIL Get-EuLLMVariant with nvidia-smi '$($c.smi)' -> '$got', want '$($c.want)'"
            } else {
              Write-Host "ok   Get-EuLLMVariant with nvidia-smi '$($c.smi)' -> '$got'"
            }
          }
          $env:Path = $origPath
          if ((Get-EuLLMVariant) -ne 'cpu') { $failed++; Write-Host 'FAIL a machine with no usable nvidia-smi did not get the CPU build' }
          if ($failed) { throw "$failed install.ps1 GPU-detection case(s) failed" }

      - name: install.ps1 against a published release
        shell: pwsh
        env:
          # Pinned, so this checks the installer rather than whatever the
          # latest release happens to contain. 0.7.10 is the first release
          # that publishes eullm-windows-x64.zip; pinning 0.7.9 tested a
          # different branch of the installer altogether (see the assertion
          # below, which is what would have caught it).
          EULLM_VERSION: 0.7.10
          EULLM_VARIANT: cpu
        run: |
          # Windows keeps a user PATH as REG_EXPAND_SZ so entries can hold
          # %VAR%, and [Environment]::SetEnvironmentVariable writes a plain
          # REG_SZ instead: same text, expansion gone. Seed the runner's PATH
          # with a %VAR% entry as ExpandString, run the installer for real, and
          # check the type and the entry survived — the runner's
          # HKCU\Environment is disposable, which is the only reason this is
          # safe to assert on.
          $key = 'HKCU:\Environment'
          $original = (Get-Item $key).GetValue('Path', $null)
          $originalKind = (Get-Item $key).GetValueKind('Path')
          try {
            Set-ItemProperty -Path $key -Name Path -Type ExpandString `
              -Value "%USERPROFILE%\eullm-probe;$original"
            $env:EULLM_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'eullm'
            Get-Content installer\install.ps1 -Raw | Invoke-Expression
            $exe = Join-Path $env:EULLM_INSTALL_DIR 'eullm.exe'
            if (-not (Test-Path $exe)) { throw "install.ps1 did not install $exe" }
            # The installer's cpu candidates are the ZIP first, then the bare
            # exe, and it installs whichever the release lists. The pinned
            # release before this one did not publish the ZIP at all, so the
            # test silently took the exe branch: Expand-Archive and the
            # multi-file copy had never run in CI, on the path every Windows
            # user takes. Assert the runtime is actually next to the exe --
            # only the ZIP carries it, which is the whole point of the bundle
            # (3da6f40) -- and the pin cannot be moved back without this
            # failing.
            if (-not (Test-Path (Join-Path $env:EULLM_INSTALL_DIR 'msvcp140.dll'))) {
              throw "install.ps1 did not install the CPU ZIP: no msvcp140.dll next to eullm.exe. The release pinned in EULLM_VERSION may predate it, and the exe branch is untested."
            }
            $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
            if (@($userPath -split ';') -notcontains $env:EULLM_INSTALL_DIR) { throw 'install.ps1 did not add the install dir to the user PATH' }
            $kind = (Get-Item $key).GetValueKind('Path')
            if ($kind -ne 'ExpandString') { throw "install.ps1 rewrote the user PATH as $kind, not ExpandString: %VAR% entries stop being expanded" }
            # The raw value, not [Environment]::GetEnvironmentVariable, which
            # hands back the already-expanded text and would pass whatever the
            # installer had done to the %VAR% entries.
            $raw = (Get-Item $key).GetValue('Path', $null, 'DoNotExpandEnvironmentNames')
            if ($raw -notlike '*%USERPROFILE%\eullm-probe*') { throw "install.ps1 dropped or froze the %VAR% entry: $raw" }
            Write-Host "user PATH is still $kind and kept its %VAR% entry"

            & eullm --version
            if ($LASTEXITCODE -ne 0) { throw "eullm --version failed with exit code $LASTEXITCODE" }
            $env:EULLM_UNINSTALL = '1'
            Get-Content installer\install.ps1 -Raw | Invoke-Expression
            if (Test-Path $env:EULLM_INSTALL_DIR) { throw 'uninstall left the install dir behind' }
            if ((Get-Item $key).GetValueKind('Path') -ne 'ExpandString') { throw 'uninstall rewrote the user PATH as a plain String' }
            if ((Get-Item $key).GetValue('Path', $null, 'DoNotExpandEnvironmentNames') -notlike '*%USERPROFILE%\eullm-probe*') { throw 'uninstall dropped the %VAR% entry' }
          } finally {
            Set-ItemProperty -Path $key -Name Path -Type $originalKind -Value $original
          }

  # ── Windows installer pre-flight (FAST, <2 min, runs on every push) ──
  # Installer preflight removed in v0.5.7 alongside the installer build
  # job in release-engine.yml. We're not shipping the Inno Setup installer
  # until its UX issues are sorted (SmartScreen warning, launcher script
  # red-flash, PATH not on by default). The /installer/ files remain as a
  # starting point for the future re-roll.
