name: Docker images

# The images the repository ships Dockerfiles for, built and started.
#
# Nothing else built them, and for months that was enough for all of them to
# rot unnoticed: the engine's could not build at all (its context, engine/,
# held neither the model catalog it compiles in nor the workspace's lockfile),
# the hub's pinned a Rust too old to read the manifest, and the containers,
# had they built, would have exited at once (the engine had no command) or
# refused to start (an audit directory owned by root). A Dockerfile is code;
# this is its test.
#
# When: on changes to what the images are made of, weekly, because the base
# images move under a Dockerfile that did not, and on demand. Not on every
# push: an image build is a full release build of the engine.
#
# No layer cache, deliberately. The GitHub cache holds 10 GB for the whole
# repository and ci.yml's Rust caches live in it; image layers would evict
# them, and each eviction costs that workflow ~25 minutes on every run. Here a
# cold build costs minutes on a run nobody is waiting for.
#
# Secret-less, like ci.yml and for the same reason: it builds and runs the
# pull request's code. `pull_request`, never `pull_request_target`.
on:
  push:
    branches: [main]
    paths:
      - '**/Dockerfile*'
      - '.dockerignore'
      - 'docker-compose.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'engine/Cargo.toml'
      - 'engine/build.rs'
      - 'engine/vendor/**'
      - 'hub/Cargo.toml'
      - 'forge/pyproject.toml'
      - '.github/workflows/docker.yml'
  pull_request:
    branches: [main]
    paths:
      - '**/Dockerfile*'
      - '.dockerignore'
      - 'docker-compose.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'engine/Cargo.toml'
      - 'engine/build.rs'
      - 'engine/vendor/**'
      - 'hub/Cargo.toml'
      - 'forge/pyproject.toml'
      - '.github/workflows/docker.yml'
  schedule:
    # Mondays, 03:23 UTC.
    - cron: '23 3 * * 1'
  workflow_dispatch:
    inputs:
      cuda:
        description: 'Build the CUDA engine image too (about an hour)'
        type: boolean
        default: false

permissions:
  contents: read

# `bash` named explicitly: that is what turns on pipefail, so a failing
# command before a `| tee` fails its step.
defaults:
  run:
    shell: bash

concurrency:
  group: docker-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  # Whether the CUDA image's own Dockerfile changed: the one image too slow
  # to build on every change to the others.
  changes:
    name: Detect changes
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      cuda: ${{ steps.filter.outputs.cuda }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            cuda:
              - 'engine/Dockerfile.cuda'
              - '.github/workflows/docker.yml'

  forge:
    name: Forge
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # PyTorch's CPU wheels: the CUDA ones add 3 GB to the image and nothing
      # to what the steps below check.
      - name: Build
        run: >-
          docker build -f forge/Dockerfile -t eullm/forge:ci
          --build-arg TORCH_INDEX=https://download.pytorch.org/whl/cpu .

      # The profiles are data files beside the code, and a non-editable
      # install leaves out what the package does not declare: the image's
      # once listed none.
      - name: The CLI starts and knows its profiles
        run: |
          docker run --rm eullm/forge:ci --help
          docker run --rm eullm/forge:ci profiles | tee profiles.txt
          grep -q legal-it profiles.txt

      # The pipeline's last stage, as the image runs it: llama.cpp's converter
      # and llama-quantize, on a model the size of nothing. Its weights are
      # random, its shape and tokenizer Qwen3's (the tokenizer is a few MB, no
      # weights, pinned to a commit), so the converter has to recognize it
      # exactly as it would a real one. The engine loads the result in the
      # next job.
      - name: Forge exports a model to GGUF
        run: |
          mkdir -p work/tokenizer
          chmod 777 work
          for f in tokenizer.json tokenizer_config.json; do
            curl -sfL --retry 3 -o "work/tokenizer/$f" \
              "https://huggingface.co/Qwen/Qwen3-0.6B/resolve/c1899de289a04d12100db370d81485cdf75e47ca/$f"
          done
          docker run --rm -i -v "$PWD/work:/work" --entrypoint python eullm/forge:ci - <<'EOF'
          import torch
          from transformers import AutoTokenizer, Qwen3Config, Qwen3ForCausalLM
          tok = AutoTokenizer.from_pretrained("/work/tokenizer")
          tok.save_pretrained("/work/tiny-qwen3")
          torch.manual_seed(0)
          Qwen3ForCausalLM(Qwen3Config(
              vocab_size=151936, hidden_size=256, intermediate_size=512,
              num_hidden_layers=2, num_attention_heads=4, num_key_value_heads=2,
              head_dim=64, max_position_embeddings=2048, tie_word_embeddings=True,
          )).to(torch.bfloat16).save_pretrained("/work/tiny-qwen3")
          EOF
          docker run --rm -v "$PWD/work:/work" eullm/forge:ci \
            export /work/tiny-qwen3 -o /work/tiny-qwen3.gguf --quant q4_k_m
          ls -l work/tiny-qwen3.gguf

      - uses: actions/upload-artifact@v7
        with:
          name: tiny-qwen3-gguf
          path: work/tiny-qwen3.gguf
          retention-days: 1

  # The engine and the hub as `docker compose` builds and starts them, which
  # also tests the compose file: its build contexts, its published ports and
  # the allowlist that has to admit callers through them.
  #
  # After `forge`, for the model it exported; but not only if it passed:
  # a broken Forge image must not hide the state of the other two.
  compose:
    name: Engine and hub (compose)
    needs: forge
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build
        run: docker compose build engine hub

      - name: Start
        run: docker compose up -d engine hub

      - name: The engine, its chat UI and the hub answer on their ports
        run: |
          curl -sf --retry 30 --retry-delay 2 --retry-all-errors http://127.0.0.1:11434/api/version
          echo
          curl -sf --retry 10 --retry-delay 2 --retry-all-errors -o /dev/null http://127.0.0.1:11435/
          curl -sf --retry 30 --retry-delay 2 --retry-all-errors http://127.0.0.1:3000/health
          echo

      # stories260K: llama.cpp's own 1 MB test model. Its checksum is pinned,
      # so a changed file fails here, named, rather than as a strange answer.
      - name: A model loads, answers, and the answer is audited
        run: |
          curl -sfL --retry 3 -o stories260K.gguf \
            https://huggingface.co/ggml-org/models/resolve/main/tinyllamas/stories260K.gguf
          echo "270cba1bd5109f42d03350f60406024560464db173c0e387d91f0426d3bd256d  stories260K.gguf" \
            | sha256sum -c
          docker compose cp stories260K.gguf engine:/models/stories260K.gguf
          curl -sf http://127.0.0.1:11434/api/generate \
            -H 'Content-Type: application/json' \
            -d '{"model":"stories260K","prompt":"Once upon a time","stream":false,"options":{"num_predict":16,"temperature":0}}' \
            | tee answer.json
          echo
          jq -e '.done and .eval_count > 0' answer.json
          docker compose exec -T engine tail -n 1 /data/audit/audit.jsonl \
            | jq -e '.model == "stories260K"'

      - uses: actions/download-artifact@v8
        if: needs.forge.result == 'success'
        with:
          name: tiny-qwen3-gguf

      # Forge's output is the engine's input: the chat goes through the chat
      # template the converter wrote into the GGUF.
      - name: The model Forge exported loads and chats
        if: needs.forge.result == 'success'
        run: |
          docker compose cp tiny-qwen3.gguf engine:/models/tiny-qwen3.gguf
          curl -sf http://127.0.0.1:11434/api/chat \
            -H 'Content-Type: application/json' \
            -d '{"model":"tiny-qwen3","messages":[{"role":"user","content":"Ciao"}],"stream":false,"options":{"num_predict":8,"temperature":0}}' \
            | tee answer.json
          echo
          jq -e '.done and .eval_count > 0' answer.json

      # A process that ignores SIGTERM is killed when the grace period runs
      # out instead: the hub did, and every `docker stop` took ten seconds.
      - name: Both stop on SIGTERM
        run: timeout 20 docker compose stop --timeout 60

      - name: Logs
        if: failure()
        run: docker compose logs --no-color

  cuda:
    name: Engine (CUDA)
    needs: changes
    # `always()`: `changes` is skipped on a schedule or a dispatch, and a
    # skipped dependency would skip this job too.
    if: >-
      always() && (
        github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' && inputs.cuda) ||
        needs.changes.outputs.cuda == 'true'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      # The CUDA development image is ~10 GB unpacked and the build's objects
      # several more: more than the runner has free until the preinstalled
      # SDKs this job does not use are removed.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # One GPU architecture: what this job proves, that the image builds and
      # carries what the binary loads, does not depend on how many it is
      # compiled for, and each one more is another pass of nvcc over every
      # kernel.
      - name: Build
        run: >-
          docker build -f engine/Dockerfile.cuda -t eullm/engine:ci-cuda
          --build-arg CUDA_ARCHS=86 .

      # No GPU here, so the binary cannot start: libcuda.so.1 is the driver's,
      # which the NVIDIA Container Toolkit mounts when the container runs.
      # Everything else it loads has to be in the image already.
      - name: Every library but the driver's is in the image
        run: |
          docker run --rm --entrypoint ldd eullm/engine:ci-cuda /usr/local/bin/eullm | tee ldd.txt
          missing=$(awk '/not found/ {print $1}' ldd.txt | tr '\n' ' ')
          echo "not found: ${missing:-nothing}"
          test "$missing" = "libcuda.so.1 "
